<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fallback Ad 300x250</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      width: 300px;
      height: 250px;
      overflow: hidden;
      font-family: Arial, sans-serif;
      background: #f1f2f7;
    }
    .ad {
      width: 300px;
      height: 250px;
      padding: 8px;
      background: #ffffff;
      border: 1px solid #e8e8ee;
      border-radius: 10px;
    }
    .title {
      margin: 0 0 6px;
      font-size: 14px;
      font-weight: 700;
      color: #222;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
    }
    .card {
      text-decoration: none;
      color: #333;
      display: block;
    }
    .thumb {
      position: relative;
      width: 100%;
      aspect-ratio: 1 / 1;
      border-radius: 8px;
      overflow: hidden;
      background: #dde1ec;
    }
    .thumb img {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
    }
    .hot {
      position: absolute;
      top: 3px;
      left: 3px;
      padding: 1px 6px;
      border-radius: 8px;
      font-size: 10px;
      color: #fff;
      background: #ff4d67;
      font-weight: 700;
    }
    .name {
      margin-top: 3px;
      text-align: center;
      font-size: 11px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
  </style>
</head>
<body>
  <div class="ad">
    <p class="title">Hot Games</p>
    <div class="grid">
      <a class="card" href="#"><div class="thumb"><span class="hot">Hot</span><img src="https://picsum.photos/seed/moto250a/120/120" alt="tail-swing" /></div><div class="name">tail-swing</div></a>
      <a class="card" href="#"><div class="thumb"><span class="hot">Hot</span><img src="https://picsum.photos/seed/moto250b/120/120" alt="blumgi-slime" /></div><div class="name">blumgi-slime</div></a>
      <a class="card" href="#"><div class="thumb"><span class="hot">Hot</span><img src="https://picsum.photos/seed/moto250c/120/120" alt="bullet-bros" /></div><div class="name">bullet-bros</div></a>
      <a class="card" href="#"><div class="thumb"><span class="hot">Hot</span><img src="https://picsum.photos/seed/moto250d/120/120" alt="shape-fold" /></div><div class="name">shape-fold</div></a>
      <a class="card" href="#"><div class="thumb"><span class="hot">Hot</span><img src="https://picsum.photos/seed/moto250e/120/120" alt="jelly-boom" /></div><div class="name">jelly-boom</div></a>
      <a class="card" href="#"><div class="thumb"><span class="hot">Hot</span><img src="https://picsum.photos/seed/moto250f/120/120" alt="draw-to-smash" /></div><div class="name">draw-to-smash</div></a>
    </div>
  </div>
  <script>
    (function () {
      function onAdClick(event) {
        event.preventDefault();
        var href = event.currentTarget && event.currentTarget.getAttribute("href");
        if (!href || href === "#" || href.indexOf("javascript:") === 0) return;
        try {
          window.parent.postMessage({ type: "fallback_ad_navigate", href: href }, "*");
        } catch (e) {
          window.top.location.href = href;
        }
      }
      var links = document.querySelectorAll("a.card[href]");
      for (var i = 0; i < links.length; i++) {
        links[i].addEventListener("click", onAdClick);
      }
    })();
  </script>
</body>
</html>
