<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Blocky Puzzle - Mobile</title>
  <script async
    src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-4202034217897578"
    crossorigin="anonymous">
  </script>
  <script>
    window.__googleAdsReady = false;
    (function trackGoogleAdsSdkReady() {
      var sdkScript = document.querySelector('script[src*="googlesyndication.com/pagead/js/adsbygoogle.js"]');
      if (!sdkScript) return;
      sdkScript.addEventListener("load", function () { window.__googleAdsReady = true; });
      sdkScript.addEventListener("error", function () { window.__googleAdsReady = false; });
    })();
    window.adsbygoogle = window.adsbygoogle || [];
    var adBreak = adConfig = function (o) { window.adsbygoogle.push(o); };
    adConfig({
        preloadAdBreaks: 'on',
        onReady: function() {
          if(window.location.search.indexOf('adType=browse') !== -1) {
          adBreak({
                type: 'start',
                name: 'openad',
                beforeAd: function() {
                    console.log("openad beforeAd");
                  },
                afterAd: function() {
                    console.log("openad afterAd");
                },
            });
          }
        },
    });
  </script>
  <link rel="stylesheet" href="./style.css">
  <style>
    body {
      min-height: 100vh;
      background: linear-gradient(180deg, #6446C0 0%, #2A2B39 25%, #2A2B39 100%);
      background-attachment: fixed;
    }
  </style>
</head>
<body>
  
  <div id="app" class="main-content">
    <div class="container">
      <div class="mobile-ad-container">
        <div class="ad-side-mark">ADVERTISEMENT</div>
        <div class="ad-center">
          <!-- ad-mob-detail-top  rectangle -->
          <ins id="topAdSlot" class="adsbygoogle"
          style="display:block;width:300px;height:250px"
          data-ad-client="ca-pub-4202034217897578"
          data-ad-slot="2645396124"
          data-full-width-responsive="true"></ins>
          <script>
          (adsbygoogle = window.adsbygoogle || []).push({});
          </script>
          <a
            id="topAdFallback"
            class="ad-fallback"
            href="https://rabigame.fun"
            target="_blank"
            rel="noopener noreferrer"
            aria-label="Open sponsor game"
          >
            <img src="images/fall-back-ads.png" alt="Fallback ad">
          </a>
        </div>
        <div class="ad-side-mark">ADVERTISEMENT</div>
      </div>

      <section class="featured-card">
        <div class="featured-media">
          <img id="featuredCover" src="images/game-cover-temple-run-2.png" class="featured-cover" alt="game cover">
          <video
            id="featuredVideo"
            class="featured-video"
            playsinline
            muted
            preload="auto"
            poster="images/game-cover-temple-run-2.png"
          >
            <source src="video/video_temple-run-2.mp4" type="video/mp4">
          </video>
          <button id="featuredPlayBtn" class="featured-play-btn" type="button" aria-label="Play preview video">
            <img src="images/play-button.png" alt="Play">
          </button>
          <img class="featured-popular-badge" src="images/game-icon/icon-popular.png" alt="Popular">
          <button id="volumeToggleBtn" class="volume-toggle-btn" type="button" aria-label="Toggle sound">
            <img id="volumeToggleIcon" src="images/volum-off.png" alt="Sound off">
          </button>
        </div>
        <div class="featured-info">
          <img id="featuredIcon" src="images/game-icon/game-icon-temple-run-2.png" class="featured-icon" alt="game icon">
          <div id="featuredName" class="featured-name">Blocky Puzzle</div>
          <button id="playNowBtn" class="play-now-btn" type="button">Play Now</button>
        </div>
      </section>

      <section class="hot-games">
        <div class="hot-header">Hot Game</div>
        <div id="hotGamesList" class="hot-games-list">
          <a class="hot-game-item" href="javascript:void(0)">
            <div class="hot-thumb-wrap">
              <img class="hot-badge" src="images/game-icon/hot-icon.png" alt="Hot">
              <img class="hot-game-thumb" src="images/game-icon/icon-tail-wing-h5.png" alt="Tail-Swing_h5">
            </div>
            <div class="hot-name">Tail-Swing_h5</div>
          </a>

          <a class="hot-game-item" href="javascript:void(0)">
            <div class="hot-thumb-wrap">
              <img class="hot-badge" src="images/game-icon/hot-icon.png" alt="Hot">
              <img class="hot-game-thumb" src="images/game-icon/icon-blumgi-slime.png" alt="Blumgi-Slime">
            </div>
            <div class="hot-name">Blumgi-Slime</div>
          </a>

          <a class="hot-game-item" href="javascript:void(0)">
            <div class="hot-thumb-wrap">
              <img class="hot-badge" src="images/game-icon/hot-icon.png" alt="Hot">
              <img class="hot-game-thumb" src="images/game-icon/game-icon-bullet-bros.png" alt="Bullet-Bros">
            </div>
            <div class="hot-name">Bullet-Bros...</div>
          </a>
        </div>
        <div style="height: 100px;"></div>
      </section>

      <div class="bottom-ad-content">
        <ins id="bottomAdSlot" class="adsbygoogle"
        style="display:inline-block;width:320px;height:100px"
        data-ad-client="ca-pub-4202034217897578"
        data-ad-slot="6213940195"></ins>
        <script>
              (adsbygoogle = window.adsbygoogle || []).push({});
        </script>
        <a
          id="bottomAdFallback"
          class="ad-fallback ad-fallback-bottom"
          href="https://rabigame.fun"
          target="_blank"
          rel="noopener noreferrer"
          aria-label="Open sponsor game"
        >
          <img src="images/fall-back-ads-banner.png" alt="Fallback ad">
        </a>
      </div>
    </div>
  </div>

  <script>
    (function setupFeaturedPreviewVideo() {
      var featuredVideo = document.getElementById("featuredVideo");
      var featuredCover = document.getElementById("featuredCover");
      var featuredPlayBtn = document.getElementById("featuredPlayBtn");
      var playNowBtn = document.getElementById("playNowBtn");
      var volumeToggleBtn = document.getElementById("volumeToggleBtn");
      var volumeToggleIcon = document.getElementById("volumeToggleIcon");
      if (!featuredVideo || !featuredCover || !featuredPlayBtn || !playNowBtn || !volumeToggleBtn || !volumeToggleIcon) return;

      var volumeOffIcon = "images/volum-off.png";
      var volumeOnIcon = "images/volum-on.png";
      var featuredGameUrl = "https://rabigame.fun/r_game/temple-run-2/index.html";

      function updateVolumeIcon() {
        var isMuted = featuredVideo.muted || featuredVideo.volume === 0;
        volumeToggleIcon.src = isMuted ? volumeOffIcon : volumeOnIcon;
        volumeToggleIcon.alt = isMuted ? "Sound off" : "Sound on";
      }

      function updatePlayButton() {
        if (!featuredVideo.classList.contains("is-ready") || featuredVideo.paused || featuredVideo.ended) {
          featuredPlayBtn.classList.remove("is-hidden");
          return;
        }
        featuredPlayBtn.classList.add("is-hidden");
      }

      function revealAndPlayVideo() {
        featuredVideo.classList.add("is-ready");
        featuredCover.classList.add("is-hidden");
        featuredVideo.play().catch(function () {
          // Some browsers block autoplay if media state is not ready.
        });
        updatePlayButton();
      }

      featuredVideo.addEventListener("canplay", revealAndPlayVideo, { once: true });
      featuredVideo.addEventListener("volumechange", updateVolumeIcon);
      featuredVideo.addEventListener("playing", updatePlayButton);
      featuredVideo.addEventListener("pause", updatePlayButton);
      featuredVideo.addEventListener("ended", updatePlayButton);

      volumeToggleBtn.addEventListener("click", function () {
        featuredVideo.muted = !featuredVideo.muted;
        if (!featuredVideo.muted && featuredVideo.volume === 0) {
          featuredVideo.volume = 1;
        }
        updateVolumeIcon();
      });

      function goFeaturedGame() {
        window.location.href = featuredGameUrl;
      }

      featuredPlayBtn.addEventListener("click", goFeaturedGame);
      playNowBtn.addEventListener("click", goFeaturedGame);

      updateVolumeIcon();
      updatePlayButton();
      featuredVideo.load();
    })();

    (function setupAdFallbacks() {
      function bindFallback(adSlotId, fallbackId, checkIntervalMs) {
        var adSlot = document.getElementById(adSlotId);
        var fallback = document.getElementById(fallbackId);
        if (!adSlot || !fallback) return;

        function showFallback() {
          fallback.classList.add("is-visible");
        }

        function hideFallback() {
          fallback.classList.remove("is-visible");
        }

        var timer = setInterval(function () {
          var sdkDone = adSlot.getAttribute("data-adsbygoogle-status") === "done";
          if (!sdkDone) {
            return;
          }

          var adStatus = adSlot.getAttribute("data-ad-status");

          if (adStatus === "filled") {
            hideFallback();
            return;
          }

          if (adStatus === "unfilled" || adStatus === "unfill-optimized") {
            showFallback();
            return;
          }
        }, checkIntervalMs);
      }

      bindFallback("topAdSlot", "topAdFallback", 500);
      bindFallback("bottomAdSlot", "bottomAdFallback", 500);
    })();

    (function setupHotGamesList() {
      var hotGamesList = document.getElementById("hotGamesList");
      if (!hotGamesList) return;

      var HOT_API_URL = "https://rabigame.fun/api/v1/game/hot?limit=21&skip=0";
      var CDN_PREFIX = "https://cdn.puzzlegame.online/";
      var DETAIL_BASE_URL = "https://rabigame.fun/detail";
      var currentSearchParams = new URLSearchParams(window.location.search || "");
      if (currentSearchParams.get("adType") === "browse") {
        currentSearchParams.delete("adType");
      }
      var filteredSearch = currentSearchParams.toString();
      var currentSearch = filteredSearch ? "?" + filteredSearch : "";

      
      var hotBadgeSrc = "images/game-icon/hot-icon.png";

      function buildCdnUrl(iconUrl) {
        if (!iconUrl) return "";
        if (/^https?:\/\//i.test(iconUrl)) return iconUrl;
        return CDN_PREFIX + String(iconUrl).replace(/^\/+/, "");
      }

      function buildDetailUrl(gameMd5) {
        return DETAIL_BASE_URL + "/" + encodeURIComponent(gameMd5 || "") + currentSearch;
      }

      function createHotGameItem(game) {
        var link = document.createElement("a");
        link.className = "hot-game-item";
        link.href = buildDetailUrl(game.gameMd5);

        var thumbWrap = document.createElement("div");
        thumbWrap.className = "hot-thumb-wrap";

        var badge = document.createElement("img");
        badge.className = "hot-badge";
        badge.src = hotBadgeSrc;
        badge.alt = "Hot";

        var thumb = document.createElement("img");
        thumb.className = "hot-game-thumb";
        thumb.src = buildCdnUrl(game.iconUrl);
        thumb.alt = game.title || "Hot game";
        thumb.loading = "lazy";

        var name = document.createElement("div");
        name.className = "hot-name";
        name.textContent = game.title || "";

        thumbWrap.appendChild(badge);
        thumbWrap.appendChild(thumb);
        link.appendChild(thumbWrap);
        link.appendChild(name);
        return link;
      }

      fetch(HOT_API_URL, { method: "GET" })
        .then(function (response) {
          if (!response.ok) {
            throw new Error("Hot games request failed");
          }
          return response.json();
        })
        .then(function (payload) {
          var gameList = payload && payload.data && Array.isArray(payload.data.gameList)
            ? payload.data.gameList
            : [];
          if (!gameList.length) return;

          hotGamesList.innerHTML = "";
          gameList.forEach(function (game) {
            if (!game || !game.gameMd5) return;
            hotGamesList.appendChild(createHotGameItem(game));
          });
        })
        .catch(function () {
          // Keep static fallback items when API fails.
        });
    })();
  </script>
</body>
</html>
