
<!DOCTYPE html>
<html lang="en">
<head>
  <script src="request-guard.js"></script>
  <meta charset="utf-8">
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
  <meta name="viewport" content="width=device-width,user-scalable=no,initial-scale=1, minimum-scale=1,maximum-scale=1"/>
  <title>My Perfect Hotel</title>
  <style>
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #000;
      font-family: Arial, sans-serif;
    }
    #mphLayout {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
    }
    #mphTopAdSlot, #mphBottomAdSlot {
      width: 100%;
      overflow: hidden;
      flex-shrink: 0;
      display: flex;
      justify-content: center;
      background: #000;
    }
    #mphGameFrame {
      width: 100%;
      border: 0;
      flex: 1;
      min-height: 0;
      background: #000;
    }
  </style>
  <script async
  data-adbreak-test="on"
    src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-4202034217897578"
    crossorigin="anonymous">
  </script>
  <script>
    window.adsbygoogle = window.adsbygoogle || [];
    var adBreak = adConfig = function (o) { window.adsbygoogle.push(o); };
    adConfig({ preloadAdBreaks: "on" });
  </script>
</head>
<body>
  <div id="mphLayout">
    <div id="mphTopAdSlot">
      <!-- hotel-manager-banner_top_1 -->
      <ins class="adsbygoogle"
      style="display:inline-block;width:320px;height:50px"
      data-ad-client="ca-pub-4202034217897578"
      data-ad-slot="6278479837"></ins>
      <script>(adsbygoogle = window.adsbygoogle || []).push({});</script>
    </div>
    <iframe
      src="game.html"
      id="mphGameFrame"
      name="mphGameFrame"
      scrolling="no"
      allow="autoplay; fullscreen"
      title="My Perfect Hotel"
    ></iframe>
    <div id="mphBottomAdSlot">
      <!-- hotel-manager-banner_bottom_1 -->
    <ins class="adsbygoogle"
    style="display:inline-block;width:320px;height:100px"
    data-ad-client="ca-pub-4202034217897578"
    data-ad-slot="5733682794"></ins>
      <script>(adsbygoogle = window.adsbygoogle || []).push({});</script>
    </div>
  </div>
  <script>
    document.getElementById("mphTopAdSlot").style.height = "50px";
    document.getElementById("mphBottomAdSlot").style.height = "100px";
  </script>
  <script src="./poki-ad-bridge-parent.js"></script>
  <script>
    window.__back_locked__ = true;
    history.pushState(null, null, location.href);
    window.addEventListener("popstate", function () {
      if (__back_locked__) {
        history.pushState(null, null, location.href);
        __back_locked__ = false;
      }
    });
  </script>
</body>
</html>
